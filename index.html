<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MusicPlayer">
  <title>Music Player</title>
  
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --tab-bg: #f8f8f8;
      --border-color: #cccccc;
      --item-border: #eeeeee;
      --btn-bg: #eeeeee;
      --accent-color: #fa233b;
      --secondary-text: #888888;
      --overlay-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    body.dark-mode {
      --bg-color: #000000;
      --text-color: #ffffff;
      --tab-bg: #1c1c1e;
      --border-color: #333333;
      --item-border: #2c2c2e;
      --btn-bg: #2c2c2e;
      --secondary-text: #aaaaaa;
      --overlay-bg: linear-gradient(135deg, rgba(40, 40, 40, 0.5), rgba(0, 0, 0, 0.1));
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    body { margin: 0; font-family: sans-serif; background: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; position: relative; min-height: 100vh; }
    
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 20%, var(--accent-color) 0%, transparent 80%);
      opacity: 0.15;
      pointer-events: none;
      z-index: -1;
      transition: background 0.3s, opacity 0.3s;
    }
    body.dark-mode::before {
      opacity: 0.25;
    }
    body.effect-off::before {
      display: none;
    }

    #loadingSpinner {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border: 4px solid var(--item-border);
      border-top: 4px solid var(--accent-color);
      border-radius: 50%; width: 50px; height: 50px;
      animation: spin 1s linear infinite;
      display: none; z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    body.dark-mode #loadingSpinner {
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    .screen { display: none; padding: 0 20px 220px 20px; height: 100vh; overflow-y: auto; box-sizing: border-box; }
    .screen.active { display: block; }
    
    #player { padding-top: 40px; overflow: hidden; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; padding-bottom: 15px; margin-bottom: 10px; }
    
    #library .header-bar,
    #playlist .header-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 5;
      margin-left: -20px;
      margin-right: -20px;
      padding-left: 20px;
      padding-right: 20px;
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    
    .header-bar h2 { margin: 0; }
    .icon-btn { background: none; border: none; color: var(--secondary-text); cursor: pointer; padding: 5px; display: flex; align-items: center; transition: color 0.3s; }
    .icon-btn:active { color: var(--accent-color); }
    .back-btn { color: var(--accent-color); padding-left: 0; margin-right: 15px; }

    .tab-bar { position: fixed; bottom: 0; width: 100%; height: calc(60px + env(safe-area-inset-bottom)); background: var(--overlay-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; border-top: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; transition: background 0.3s; z-index: 20; }
    .tab { flex: 1; text-align: center; cursor: pointer; color: var(--secondary-text); transition: color 0.3s; display: flex; justify-content: center; align-items: center; }
    .tab.active { color: var(--accent-color); }
    .tab svg { width: 28px; height: 28px; }

    .song-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid var(--item-border); cursor: pointer; font-size: 16px; }
    .song-item:active { background: var(--item-border); }

    #miniPlayer { position: fixed; bottom: calc(60px + env(safe-area-inset-bottom)); width: 100%; background: var(--overlay-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); padding: 10px 20px 2px; box-sizing: border-box; z-index: 10; display: none; transition: background 0.3s; }

    .controls { display: flex; justify-content: space-around; margin-top: 2px; align-items: center; }
    .controls button { padding: 0; background: transparent; color: var(--accent-color); border: none; border-radius: 5px; width: 35px; height: 35px; cursor: pointer; transition: background 0.2s, color 0.2s; display: flex; justify-content: center; align-items: center; opacity: 0.5; overflow: hidden; }
    .controls button.play-pause-btn { opacity: 1; width: 40px; height: 40px; }
    .controls button.active-btn { background: var(--accent-color); color: var(--bg-color); opacity: 1; }
    .controls button svg { width: 28px; height: 28px; }
    .controls button.play-pause-btn svg { width: 32px; height: 32px; }
    
    input[type=range] { width: 100%; margin-top: 2px; }

    #player .player-container { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
    
    .artwork-wrapper {
      position: relative;
      width: 256px;
      height: 256px;
      margin: 20px auto 10px;
      perspective: 1000px;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    .artwork-card {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--item-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex; justify-content: center; align-items: center;
      transform-origin: center center;
      will-change: transform, opacity;
      transition: all 0.3s ease;
    }
    #artworkCard0 { z-index: 3; transform: translate(0, 0) scale(1); opacity: 1; }
    #artworkCard1 { z-index: 2; transform: translate(20px, -20px) scale(0.9); opacity: 0.6; }
    #artworkCard2 { z-index: 1; transform: translate(40px, -40px) scale(0.8); opacity: 0.3; }
    #artworkCardPrev { z-index: 4; transform: translate(-280px, 0) scale(1) rotate(-15deg); opacity: 0; }

    .artwork-img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
    .artwork-fallback { color: var(--border-color); display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; pointer-events: none; }
    .artwork-fallback svg { width: 120px; height: 120px; }

    #playerTags {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      width: calc(100% + 40px);
      margin-left: -20px;
      padding: 0 20px 10px;
      box-sizing: border-box;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #playerTags::-webkit-scrollbar { display: none; }
    
    .tag-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      flex: 0 0 auto;
    }
    .tag-btn.active { background: var(--accent-color); color: var(--bg-color); border-color: var(--accent-color); }
    
    h3 { margin-top: 30px; border-bottom: 1px solid var(--item-border); padding-bottom: 10px; font-size: 16px; color: var(--secondary-text); }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 28px; }
    .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }

    .color-picker { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; box-sizing: border-box; flex: none; }
    .color-btn.active { border-color: var(--text-color); transform: scale(1.1); }
    
    .input-field { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); }
    .action-btn { display: inline-block; text-align: center; padding: 10px 15px; border: none; border-radius: 5px; background: var(--btn-bg); color: var(--text-color); cursor: pointer; font-weight: bold; transition: background 0.2s; box-sizing: border-box; }
    .action-btn.active-action { background: var(--accent-color); color: var(--bg-color); }
    
    .tag-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--item-border); border-radius: 5px; margin-top: 10px; }
    
    .song-checkbox { transform: scale(1.3); margin-right: 15px; accent-color: var(--accent-color); }

    .version { font-size: 12px; color: var(--secondary-text); margin-top: 40px; border-top: 1px solid var(--item-border); padding-top: 10px; }
    #statusMsg { color: var(--accent-color); font-size: 14px; margin-top: 10px; height: 20px; }

    @keyframes scroll-marquee {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--scroll-dist)); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>
  
  <div id="loadingSpinner"></div>

  <div id="library" class="screen active">
    <div class="header-bar">
      <h2>ライブラリ</h2>
      <button id="goToSettingsBtn" class="icon-btn">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
    <div id="songList"></div>
  </div>

  <div id="player" class="screen">
    <div class="player-container">
      <div class="artwork-wrapper" id="artworkWrapper">
        <div class="artwork-card" id="artworkCardPrev">
          <img class="artwork-img" />
          <div class="artwork-fallback"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        </div>
        <div class="artwork-card" id="artworkCard2">
          <img class="artwork-img" />
          <div class="artwork-fallback"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        </div>
        <div class="artwork-card" id="artworkCard1">
          <img class="artwork-img" />
          <div class="artwork-fallback"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        </div>
        <div class="artwork-card" id="artworkCard0">
          <img class="artwork-img" />
          <div class="artwork-fallback"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        </div>
      </div>
      <div id="playerTags"></div>
    </div>
  </div>

  <div id="playlist" class="screen">
    <div id="playlistTagListView">
      <div class="header-bar">
        <h2>プレイリスト</h2>
        <button id="goToSettingsBtnFromPlaylist" class="icon-btn">
          <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
      <div id="playlistTagList"></div>
    </div>
    
    <div id="playlistSongListView" style="display: none;">
      <div class="header-bar" style="justify-content: flex-start;">
        <button id="backToTagListBtn" class="icon-btn back-btn">
          <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h2 id="currentPlaylistTitle">プレイリスト名</h2>
      </div>
      <div id="playlistSongList"></div>
    </div>
  </div>
  
  <div id="settings" class="screen">
    <div class="header-bar" style="justify-content: flex-start;">
      <button id="backToLibraryBtn" class="icon-btn back-btn">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2>設定</h2>
    </div>

    <h3>曲の追加 / 削除</h3>
    <div style="margin-bottom: 15px;">
      <label for="fileInput" class="action-btn" style="display: block; width: 100%;">ファイルを選択 (MP3 / ZIP)</label>
      <input type="file" id="fileInput" accept="audio/mp3, audio/mpeg, application/zip, .zip" multiple style="display: none;">
      <div id="statusMsg"></div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button id="selectDeleteBtn" class="action-btn" style="flex:1;">選択削除</button>
      <button id="deleteAllBtn" class="action-btn" style="flex:1;">全曲削除</button>
    </div>

    <h3>タグの追加 / 削除</h3>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button id="addTagModeBtn" class="action-btn active-action" style="flex:1;">追加</button>
      <button id="deleteTagModeBtn" class="action-btn" style="flex:1;">削除</button>
    </div>
    
    <div id="addTagSection" style="display: flex; gap: 10px; margin-top: 15px;">
      <input type="text" id="newTagInput" class="input-field" placeholder="新しいタグ名">
      <button id="addTagSubmitBtn" class="action-btn active-action">登録</button>
    </div>
    <div id="deleteTagSection" style="display: none; margin-top: 15px;">
      <div id="settingsTagList"></div>
    </div>

    <h3>カラー設定</h3>
    <div class="setting-row">
      <span>ダークモード</span>
      <label class="switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>背景エフェクト</span>
      <label class="switch">
        <input type="checkbox" id="bgEffectToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>高画質ジャケ写 (次回から)</span>
      <label class="switch">
        <input type="checkbox" id="highResToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div style="margin-top: 25px;">
      <span>テーマカラー</span>
      <div class="color-picker" id="colorPicker"></div>
    </div>

    <div class="version">ver2.4.1</div>
  </div>

  <div id="deleteScreen" class="screen">
    <div class="header-bar" style="justify-content: flex-start;">
      <button id="backToSettingsFromDeleteBtn" class="icon-btn back-btn">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2>曲の選択削除</h2>
    </div>
    <div id="deleteSongList"></div>
    <button id="executeDeleteBtn" class="action-btn" style="width: 100%; margin-top: 20px; background: #ff3b30; color: #fff;">選択した曲を削除</button>
  </div>

  <div id="miniPlayer">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
      <div class="now-playing-container" style="flex: 1; overflow: hidden; margin-right: 15px; margin-bottom: 2px;">
        <div id="nowPlaying" style="font-weight: bold; font-size: 15px; white-space: nowrap; display: inline-block;">曲が選択されていません</div>
      </div>
      <div id="timeDisplay" style="font-size: 12px; color: var(--secondary-text); text-align: right; margin-bottom: 2px; white-space: nowrap;">0:00 / 0:00</div>
    </div>
    <input type="range" id="progressBar" value="0" step="0.1">
    <div class="controls">
      <button id="playPauseBtn" class="play-pause-btn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <button id="shuffleBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button id="repeatBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </div>
  
  <audio id="audioPlayer" style="display: none;"></audio>

  <div class="tab-bar">
    <div id="tab-library" class="tab active" onclick="switchTab(event, 'library')">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div id="tab-player" class="tab" onclick="switchTab(event, 'player')">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    </div>
    <div id="tab-playlist" class="tab" onclick="switchTab(event, 'playlist')">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(err) {});
      });
    }

    var iconPlay = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
    var iconPause = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    var audioPlayer = document.getElementById('audioPlayer');
    var miniPlayer = document.getElementById('miniPlayer');
    var nowPlaying = document.getElementById('nowPlaying');

    function resizeArtwork(pictureData, pictureFormat) {
      return new Promise(function(resolve) {
        if (!pictureData) {
          resolve(null);
          return;
        }
        var blob = new Blob([new Uint8Array(pictureData)], { type: pictureFormat });
        var url = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var MAX_SIZE = isHighRes ? 600 : 300;
          var width = img.width;
          var height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          var quality = isHighRes ? 0.9 : 0.8;
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          URL.revokeObjectURL(url);
          resolve(dataUrl);
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    }

    function extractTags(fileOrBlob) {
      return new Promise(function(resolve) {
        if (window.jsmediatags) {
          jsmediatags.read(fileOrBlob, {
            onSuccess: async function(tag) {
              var artworkDataUrl = null;
              if (tag.tags && tag.tags.picture) {
                artworkDataUrl = await resizeArtwork(tag.tags.picture.data, tag.tags.picture.format);
              }
              resolve({ artwork: artworkDataUrl });
            },
            onError: function() {
              resolve({ artwork: null });
            }
          });
        } else {
          resolve({ artwork: null });
        }
      });
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      if (!db) return;
      var files = e.target.files;
      if (files.length === 0) return;

      var statusMsg = document.getElementById('statusMsg');
      
      function saveToDB(songData) {
        return new Promise(function(resolve, reject) {
          var transaction = db.transaction(["songs"], "readwrite");
          var store = transaction.objectStore("songs");
          var request = store.add(songData);
          request.onsuccess = function() { resolve(); };
          request.onerror = function(err) { reject(err); };
        });
      }

      var totalFiles = files.length;
      var processedCount = 0;

      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var ext = file.name.split('.').pop().toLowerCase();
        
        if (ext !== 'mp3' && ext !== 'zip') {
          processedCount++;
          continue;
        }
        
        if (ext === 'zip') {
          statusMsg.textContent = 'ZIPファイルを解析中...';
          try {
            var zip = await JSZip.loadAsync(file);
            var zipEntries = [];
            for (var filename in zip.files) {
              var zipEntry = zip.files[filename];
              if (!zipEntry.dir && filename.toLowerCase().endsWith('.mp3')) {
                zipEntries.push(zipEntry);
              }
            }
            
            for (var j = 0; j < zipEntries.length; j++) {
              var entry = zipEntries[j];
              statusMsg.textContent = 'ZIP展開＆保存中: ' + (j + 1) + ' / ' + zipEntries.length + ' 曲';
              var arrayBuffer = await entry.async("arraybuffer");
              var type = 'audio/mpeg';
              var cleanName = entry.name.split('/').pop().replace(/\.[^/.]+$/, "");
              
              if (!cleanName.startsWith('._')) {
                var tempBlob = new Blob([arrayBuffer], { type: type });
                var tags = await extractTags(tempBlob);
                tempBlob = null;
                
                await saveToDB({
                  name: cleanName,
                  type: type,
                  data: arrayBuffer,
                  artwork: tags.artwork,
                  tags: []
                });
              }
              arrayBuffer = null;
            }
          } catch(err) {}
          processedCount++;
        } else {
          statusMsg.textContent = '保存中: ' + (processedCount + 1) + ' / ' + totalFiles + ' 曲';
          var cleanName = file.name.replace(/\.[^/.]+$/, "");
          var tags = await extractTags(file);
          
          await new Promise(function(resolve) {
            var fileReader = new FileReader();
            fileReader.onload = async function(event) {
              await saveToDB({
                name: cleanName,
                type: file.type || 'audio/mpeg',
                data: event.target.result,
                artwork: tags.artwork,
                tags: []
              });
              resolve();
            };
            fileReader.readAsArrayBuffer(file);
          });
          processedCount++;
        }
      }

      statusMsg.textContent = '読み込み完了だよ';
      setTimeout(function() { statusMsg.textContent = ''; }, 2000);
      
      displaySongs();
      showLibrary();
      e.target.value = '';
    });

    function getArtwork(songMeta, callback) {
      if (!songMeta) {
        callback(null);
        return;
      }
      if (artworkCache[songMeta.id] !== undefined) {
        var idx = artworkCacheQueue.indexOf(songMeta.id);
        if (idx > -1) {
          artworkCacheQueue.splice(idx, 1);
          artworkCacheQueue.push(songMeta.id);
        }
        callback(artworkCache[songMeta.id]);
        return;
      }
      
      var transaction = db.transaction(["songs"], "readonly");
      var store = transaction.objectStore("songs");
      var request = store.get(songMeta.id);
      
      request.onsuccess = function(e) {
        var song = e.target.result;
        if (!song) {
          artworkCache[songMeta.id] = null;
          callback(null);
          return;
        }

        if (song.artwork) {
          artworkCache[songMeta.id] = song.artwork;
          artworkCacheQueue.push(songMeta.id);
          if (artworkCacheQueue.length > MAX_ARTWORK_CACHE) {
            var oldId = artworkCacheQueue.shift();
            if (artworkCache[oldId] && artworkCache[oldId].startsWith('blob:')) {
              URL.revokeObjectURL(artworkCache[oldId]);
            }
            delete artworkCache[oldId];
          }
          callback(song.artwork);
          return;
        }

        if (song.data) {
          var blob = new Blob([song.data], { type: song.type });
          if (window.jsmediatags) {
            jsmediatags.read(blob, {
              onSuccess: function(tag) {
                if (tag.tags && tag.tags.picture) {
                  var picture = tag.tags.picture;
                  var artBlob = new Blob([new Uint8Array(picture.data)], {type: picture.format});
                  var url = URL.createObjectURL(artBlob);
                  artworkCache[songMeta.id] = url;
                  artworkCacheQueue.push(songMeta.id);
                  if (artworkCacheQueue.length > MAX_ARTWORK_CACHE) {
                    var oldId = artworkCacheQueue.shift();
                    if (artworkCache[oldId] && artworkCache[oldId].startsWith('blob:')) {
                      URL.revokeObjectURL(artworkCache[oldId]);
                    }
                    delete artworkCache[oldId];
                  }
                  callback(url);
                } else {
                  artworkCache[songMeta.id] = null;
                  callback(null);
                }
              },
              onError: function() {
                artworkCache[songMeta.id] = null;
                callback(null);
              }
            });
          } else {
            artworkCache[songMeta.id] = null;
            callback(null);
          }
        } else {
          artworkCache[songMeta.id] = null;
          callback(null);
        }
      };
      
      request.onerror = function() {
        artworkCache[songMeta.id] = null;
        callback(null);
      };
    }

    function preloadArtworks() {

        if (idx >= currentSongs.length) return;
        if (window.isAudioLoading) {
          setTimeout(next, 500);
          return;
        }
        var songMeta = currentSongs[idx];
        if (artworkCache[songMeta.id] === undefined) {
          getArtwork(songMeta, function() {
            idx++;
            setTimeout(next, 300);
          });
        } else {
          idx++;
          next();
        }
      }
      setTimeout(next, 2000);
    }

    function playSong(index, keepQueue) {
      if (index < 0 || index >= currentSongs.length) return;
      currentIndex = index;
      var songMeta = currentSongs[currentIndex];
      
      if (currentSongs.length > 1) {
        if (isShuffle) {
          if (keepQueue && nextIndex2 !== -1) {
            nextIndex1 = nextIndex2;
            nextIndex2 = Math.floor(Math.random() * currentSongs.length);
          } else {
            nextIndex1 = Math.floor(Math.random() * currentSongs.length);
            nextIndex2 = Math.floor(Math.random() * currentSongs.length);
          }
        } else {
          nextIndex1 = (currentIndex + 1) % currentSongs.length;
          nextIndex2 = (currentIndex + 2) % currentSongs.length;
        }
      } else {
        nextIndex1 = currentIndex;
        nextIndex2 = currentIndex;
      }

      nowPlaying.textContent = songMeta.name;
      nowPlaying.style.animation = 'none';
      nowPlaying.style.transform = 'translateX(0)';
      setTimeout(function() {
        var containerWidth = nowPlaying.parentElement.clientWidth;
        var textWidth = nowPlaying.scrollWidth;
        if (textWidth > containerWidth) {
          var dist = textWidth - containerWidth + 10;
          nowPlaying.style.setProperty('--scroll-dist', '-' + dist + 'px');
          nowPlaying.style.animation = 'scroll-marquee ' + (dist / 15) + 's linear infinite alternate';
        }
      }, 50);
      
      var card0 = document.getElementById('artworkCard0');
      var card1 = document.getElementById('artworkCard1');
      var card2 = document.getElementById('artworkCard2');
      var cardPrev = document.getElementById('artworkCardPrev');
      
      loadCardArtwork(songMeta, card0);
      if (currentSongs.length > 1) {
        loadCardArtwork(currentSongs[nextIndex1], card1);
        loadCardArtwork(currentSongs[nextIndex2], card2);
        
        var prevIdx = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
        loadCardArtwork(currentSongs[prevIdx], cardPrev);
      } else {
        loadCardArtwork(songMeta, card1);
        loadCardArtwork(songMeta, card2);
        loadCardArtwork(songMeta, cardPrev);
      }
      
      resetCardPositions();
      updatePlayerTags();

      document.getElementById('loadingSpinner').style.display = 'block';
      window.isAudioLoading = true;

      var transaction = db.transaction(["songs"], "readonly");
      var store = transaction.objectStore("songs");
      var request = store.get(songMeta.id);
      
      request.onsuccess = function(e) {
        var song = e.target.result;
        if(!song) {
          document.getElementById('loadingSpinner').style.display = 'none';
          window.isAudioLoading = false;
          return;
        }
        var blob = new Blob([song.data], { type: song.type });
        if(currentAudioUrl) {
          URL.revokeObjectURL(currentAudioUrl);
        }
        currentAudioUrl = URL.createObjectURL(blob);
        audioPlayer.src = currentAudioUrl;

        var playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.then(function() {
            finishLoad();
          }).catch(function(error) {
            finishLoad();
          });
        } else {
          finishLoad();
        }

        function finishLoad() {
          document.getElementById('loadingSpinner').style.display = 'none';
          window.isAudioLoading = false;
          updatePlayPauseIcon(true);
          switchTab(null, 'player');
        }
      };
    }

    function togglePlay() {
      if (audioPlayer.src) {
        if (audioPlayer.paused) {
          audioPlayer.play(); updatePlayPauseIcon(true);
        } else {
          audioPlayer.pause(); updatePlayPauseIcon(false);
        }
      }
    }
    
    playPauseBtn.addEventListener('click', togglePlay);

    audioPlayer.addEventListener('timeupdate', function() {
      var current = audioPlayer.currentTime;
      var duration = audioPlayer.duration || 0;
      
      progressBar.max = duration;
      progressBar.value = current;
      
      var curMin = Math.floor(current / 60);
      var curSec = Math.floor(current % 60).toString().padStart(2, '0');
      var durMin = Math.floor(duration / 60) || 0;
      var durSec = Math.floor(duration % 60).toString().padStart(2, '0') || '00';
      
      if (!isNaN(duration)) {
        timeDisplay.textContent = curMin + ':' + curSec + ' / ' + durMin + ':' + durSec;
      }
    });

    progressBar.addEventListener('input', function(e) {
      if (audioPlayer.src) audioPlayer.currentTime = parseFloat(e.target.value);
    });

    function playNextAction() {
      if (currentSongs.length === 0) return;
      if (isRepeat) {
        playSong(currentIndex, false);
      } else {
        var nextIdx = isShuffle ? nextIndex1 : (currentIndex + 1) % currentSongs.length;
        playSong(nextIdx, true);
      }
    }

    function playPrevAction() {
      if (currentSongs.length === 0) return;
      if (isRepeat) {
        playSong(currentIndex, false);
      } else if (isShuffle) {
        playSong(Math.floor(Math.random() * currentSongs.length), false);
      } else {
        var pIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
        playSong(pIndex, false);
      }
    }

    audioPlayer.addEventListener('ended', playNextAction);

    shuffleBtn.addEventListener('click', function() {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active-btn', isShuffle);
      if (isShuffle) {
        isRepeat = false;
        repeatBtn.classList.remove('active-btn');
        if (currentSongs.length > 1) {
          nextIndex1 = Math.floor(Math.random() * currentSongs.length);
          nextIndex2 = Math.floor(Math.random() * currentSongs.length);
          loadCardArtwork(currentSongs[nextIndex1], document.getElementById('artworkCard1'));
          loadCardArtwork(currentSongs[nextIndex2], document.getElementById('artworkCard2'));
          
          var prevIdx = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
          loadCardArtwork(currentSongs[prevIdx], document.getElementById('artworkCardPrev'));
        }
      } else {
        if (currentSongs.length > 1 && currentIndex >= 0) {
          nextIndex1 = (currentIndex + 1) % currentSongs.length;
          nextIndex2 = (currentIndex + 2) % currentSongs.length;
          loadCardArtwork(currentSongs[nextIndex1], document.getElementById('artworkCard1'));
          loadCardArtwork(currentSongs[nextIndex2], document.getElementById('artworkCard2'));
          
          var prevIdx = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
          loadCardArtwork(currentSongs[prevIdx], document.getElementById('artworkCardPrev'));
        }
      }
    });

    repeatBtn.addEventListener('click', function() {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active-btn', isRepeat);
      if (isRepeat) {
        isShuffle = false;
        shuffleBtn.classList.remove('active-btn');
      }
    });

    var wrapper = document.getElementById('artworkWrapper');
    var isDragging = false;
    var startX = 0;
    var currentX = 0;

    function handleStart(e) {
      if (currentSongs.length <= 1) return;
      isDragging = true;
      startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
      
      var card0 = document.getElementById('artworkCard0');
      var card1 = document.getElementById('artworkCard1');
      var card2 = document.getElementById('artworkCard2');
      var cardPrev = document.getElementById('artworkCardPrev');
      
      card0.style.transition = 'none';
      card1.style.transition = 'none';
      card2.style.transition = 'none';
      cardPrev.style.transition = 'none';
    }

    function handleMove(e) {
      if (!isDragging) return;
      var x = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
      currentX = x - startX;
      
      var card0 = document.getElementById('artworkCard0');
      var card1 = document.getElementById('artworkCard1');
      var card2 = document.getElementById('artworkCard2');
      var cardPrev = document.getElementById('artworkCardPrev');
      
      if (currentX < 0) {
        card0.style.zIndex = 3;
        card0.style.transform = 'translate(' + currentX + 'px, 0px) rotate(' + (currentX * 0.05) + 'deg)';
        card0.style.opacity = 1 - Math.min(Math.abs(currentX) / 300, 0.5);

        var progress = Math.min(Math.abs(currentX) / 150, 1);
        card1.style.transform = 'translate(' + (20 - 20 * progress) + 'px, ' + (-20 + 20 * progress) + 'px) scale(' + (0.9 + 0.1 * progress) + ')';
        card1.style.opacity = 0.6 + 0.4 * progress;
        
        card2.style.transform = 'translate(' + (40 - 20 * progress) + 'px, ' + (-40 + 20 * progress) + 'px) scale(' + (0.8 + 0.1 * progress) + ')';
        card2.style.opacity = 0.3 + 0.3 * progress;
        
        cardPrev.style.opacity = 0;
      } else if (currentX > 0) {
        var progress = Math.min(currentX / 150, 1);
        
        card0.style.zIndex = 3;
        card0.style.transform = 'translate(' + (20 * progress) + 'px, ' + (-20 * progress) + 'px) scale(' + (1 - 0.1 * progress) + ')';
        card0.style.opacity = 1 - 0.4 * progress;

        card1.style.transform = 'translate(' + (20 + 20 * progress) + 'px, ' + (-20 - 20 * progress) + 'px) scale(' + (0.9 - 0.1 * progress) + ')';
        card1.style.opacity = 0.6 - 0.3 * progress;
        
        card2.style.transform = 'translate(' + (40 + 20 * progress) + 'px, ' + (-40 - 20 * progress) + 'px) scale(' + (0.8 - 0.1 * progress) + ')';
        card2.style.opacity = 0.3 - 0.3 * progress;
        
        cardPrev.style.zIndex = 4;
        cardPrev.style.opacity = progress;
        var moveX = -280 + currentX * 1.5;
        if (moveX > 0) moveX = 0;
        var rot = -15 + (currentX / 150) * 15;
        if (rot > 0) rot = 0;
        cardPrev.style.transform = 'translate(' + moveX + 'px, 0px) rotate(' + rot + 'deg)';
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      
      var card0 = document.getElementById('artworkCard0');
      var card1 = document.getElementById('artworkCard1');
      var card2 = document.getElementById('artworkCard2');
      var cardPrev = document.getElementById('artworkCardPrev');
      
      card0.style.transition = 'all 0.3s ease';
      card1.style.transition = 'all 0.3s ease';
      card2.style.transition = 'all 0.3s ease';
      cardPrev.style.transition = 'all 0.3s ease';
      
      if (currentX < -80) {
        card0.style.transform = 'translate(-150%, 0px) rotate(-15deg)';
        card0.style.opacity = 0;
        setTimeout(function() { playNextAction(); }, 300);
      } else if (currentX > 80) {
        cardPrev.style.transform = 'translate(0px, 0px) rotate(0deg)';
        cardPrev.style.opacity = 1;
        card0.style.transform = 'translate(20px, -20px) scale(0.9)';
        card0.style.opacity = 0.6;
        setTimeout(function() { playPrevAction(); }, 300);
      } else {
        resetCardPositions();
      }
      currentX = 0;
    }

    wrapper.addEventListener('touchstart', handleStart, {passive: true});
    wrapper.addEventListener('touchmove', handleMove, {passive: true});
    wrapper.addEventListener('touchend', handleEnd);
    wrapper.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
  </script>
</body>
</html>
